<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Cumpleaños 🎉</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

canvas { display: block; }

/* TEXTOS */
.texto {
  position: absolute;
  width: 100%;
  text-align: center;
  font-weight: bold;
  z-index: 10;
  animation: colores 3s infinite alternate;
}

#titulo {
  top: 30px;
  font-size: 60px;
}

#subtitulo {
  top: 110px;
  font-size: 34px;
}

@keyframes colores {
  0% { color: #ff4040; }
  25% { color: #ffd700; }
  50% { color: #40ff40; }
  75% { color: #40cfff; }
  100% { color: #ff40ff; }
}

/* TORTA IMAGEN */
#torta {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  z-index: 10;
}

#torta img {
  width: 100%;
  display: block;
}
</style>
</head>

<body>

<div class="texto" id="titulo">🎉 MI CUMPLEAÑOS 🎉</div>
<div class="texto" id="subtitulo">Feliz cumpleaños para mí</div>

<!-- TORTA PNG -->
<div id="torta">
  <img src="torta.png" alt="Torta de cumpleaños">
</div>

<canvas id="canvas"></canvas>

<!-- SONIDOS -->
<audio id="musica" src="musica.mp3" loop></audio>
<audio id="boom" src="explosion.mp3"></audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const boom = document.getElementById("boom");
const musica = document.getElementById("musica");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let fireworks = [];

class Firework {
  constructor(x = Math.random() * canvas.width, y = canvas.height) {
    this.x = x;
    this.y = y;
    this.targetY = Math.random() * canvas.height / 2 + 100;
    this.color = `hsl(${Math.random() * 360},100%,60%)`;
    this.exploded = false;
    this.particles = [];
    this.heart = Math.random() < 0.4; // corazones
  }

  update() {
    if (!this.exploded) {
      this.y -= 7;
      if (this.y <= this.targetY) this.explode();
    } else {
      this.particles.forEach(p => p.update());
    }
  }

  draw() {
    if (!this.exploded) {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.x, this.y, 3, 12);
    } else {
      this.particles.forEach(p => p.draw());
    }
  }

  explode() {
    this.exploded = true;
    boom.currentTime = 0;
    boom.play();

    for (let i = 0; i < 120; i++) {
      if (this.heart) {
        const t = Math.random() * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        this.particles.push(new Particle(this.x, this.y, this.color, x*0.4, y*0.4));
      } else {
        this.particles.push(new Particle(this.x, this.y, this.color));
      }
    }
  }
}

class Particle {
  constructor(x, y, color, vx=null, vy=null) {
    this.x = x;
    this.y = y;
    this.color = color;
    if (vx !== null) {
      this.vx = vx;
      this.vy = vy;
    } else {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * 4 + 1;
      this.vx = Math.cos(a) * s;
      this.vy = Math.sin(a) * s;
    }
    this.life = 120;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.03;
    this.life--;
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, 2, 2);
  }
}

// Automáticos
setInterval(() => fireworks.push(new Firework()), 700);

// Click
canvas.addEventListener("click", e => {
  fireworks.push(new Firework(e.clientX, e.clientY));
  musica.play();
});

function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  fireworks.forEach(f => {
    f.update();
    f.draw();
  });

  fireworks = fireworks.filter(f =>
    !f.exploded || f.particles.some(p => p.life > 0)
  );

  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
